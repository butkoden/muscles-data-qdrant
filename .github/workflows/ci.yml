name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install --pre "muscles>=1.0.0rc1,<2.0.0" "muscles-data>=0.1.0,<1.0.0"
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "qdrant-client>=1.10,<2.0"
      - run: python -m pytest -q
      - run: python -m build --wheel --sdist

  integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --pre "muscles>=1.0.0rc1,<2.0.0" "muscles-data>=0.1.0,<1.0.0"
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m pip install "pytest>=8.0,<9.0" "qdrant-client>=1.10,<2.0"
      - run: curl --retry 30 --retry-connrefused --retry-delay 2 http://127.0.0.1:6333/healthz
      - run: python -m pytest -q -m integration
        env:
          MUSCLES_DATA_INTEGRATION: "1"
          QDRANT_URL: http://127.0.0.1:6333
